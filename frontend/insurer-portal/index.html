<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaShields Plus — Rider App</title>
<link rel="stylesheet" href="../shared-base.css" />
<link rel="stylesheet" href="css/insurer.css" />
</head>
<body>
  <div class="ns-center-screen">
    <div class="ns-card">
      <div class="ns-brand">
        <div class="ns-brand-dot"></div>
        <div class="ns-brand-name">NovaShields Plus</div>
      </div>
      <div class="ns-subtitle">Insurer Portal — auto-generated reports</div>

      <div class="ns-error" id="errorBox"></div>

      <form id="loginForm">
        <div class="ns-field">
          <label for="email">Email</label>
          <input type="email" id="email" value="insurer@demo.novashields.app" required />
        </div>
        <div class="ns-field">
          <label for="password">Password</label>
          <input type="password" id="password" value="password123" required />
        </div>
        <button type="submit" class="ns-btn" id="submitBtn">Log in</button>
      </form>

      <div class="ns-hint">Demo account pre-filled — run <code>npm run seed</code> on the backend first.</div>
    </div>
  </div>

  <script src="../shared-config.js"></script>
  <script src="../shared-api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
