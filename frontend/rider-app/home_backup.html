<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NovaShields Plus — Rider Home</title>
<link rel="stylesheet" href="../shared-base.css" />
<link rel="stylesheet" href="css/rider.css" />
</head>
<body>
  <div class="ns-topbar">
    <div class="ns-brand">
      <div class="ns-brand-dot"></div>
      <div class="ns-brand-name">NovaShields Plus</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="ns-badge" id="userName">—</span>
      <button class="ns-btn" style="width:auto; padding:8px 14px;" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div style="padding: 24px;">
    <div class="ns-card" style="max-width: 640px; margin: 0 auto 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
        <strong>Live Telemetry</strong>
        <span class="ns-badge" id="connBadge">connecting…</span>
      </div>
      <div id="liveEmpty" class="ns-empty-state" style="padding: 30px 10px;">
        Waiting for telemetry… run <code>npm run simulate</code> on the backend
        to see this update in real time.
      </div>
      <div id="liveStats" style="display:none; grid-template-columns: 1fr 1fr; gap: 14px;">
        <div><div class="ns-subtitle" style="margin:0;">Speed</div><div style="font-size:28px;font-weight:700;" id="statSpeed">—</div></div>
        <div><div class="ns-subtitle" style="margin:0;">Accel</div><div style="font-size:28px;font-weight:700;" id="statAccel">—</div></div>
        <div><div class="ns-subtitle" style="margin:0;">Lat</div><div id="statLat">—</div></div>
        <div><div class="ns-subtitle" style="margin:0;">Lng</div><div id="statLng">—</div></div>
      </div>
    </div>

    <div class="ns-card" style="max-width: 640px; margin: 0 auto;">
      <strong>Trip status</strong>
      <div id="tripStatus" class="ns-empty-state" style="padding: 20px 10px;">No active trip.</div>
    </div>
  </div>

  <script src="../shared-config.js"></script>
  <script src="../shared-api.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
